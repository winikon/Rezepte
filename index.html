<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <link rel="manifest" href='data:application/manifest+json;utf8,{"name":"mr78 Rezepte","short_name":"Rezepte","start_url":".","display":"standalone","background_color":"#E6E4DD","theme_color":"#E6E4DD","icons":[{"src":"https://winikon.github.io/Rezepte/logomr78brutalist.png","sizes":"512x512","type":"image/png"}]}'>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #E6E4DD; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #E6E4DD; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #dc2626; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .safe-pb { padding-bottom: max(5rem, env(safe-area-inset-bottom)); }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        @media print {
            body { background-color: white !important; font-size: 11pt !important; }
            .print\:hidden { display: none !important; }
            #mainContent { overflow: visible !important; height: auto !important; padding: 0 !important; }
            #detailView { border: none !important; box-shadow: none !important; margin: 0 !important; max-width: 100% !important; width: 100% !important; }
            .page-break-inside-avoid { page-break-inside: avoid; }

        .timer-box { animation: slideIn 0.3s forwards; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .timer-ringing { animation: pulseRed 1s infinite; }
        @keyframes pulseRed { 50% { background-color: #ef4444; color: white; } }
    </style>
</head>
<body class="text-gray-900 h-screen flex flex-col overflow-hidden bg-[#E6E4DD]">

    <!-- LADEBILDSCHIRM -->
    <div id="loadingOverlay" class="fixed inset-0 bg-[#E6E4DD] z-[60] flex flex-col items-center justify-center print:hidden">
        <div class="loader mb-4"></div>
        <p class="text-gray-600 font-medium" id="loadingText">App wird geladen...</p>
    </div>

    <!-- LOGIN -->
    <div id="loginView" class="hidden fixed inset-0 bg-[#E6E4DD] z-50 flex items-center justify-center p-4 print:hidden">
        <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md">
            <div class="text-center mb-8">
                <img src="logomr78brutalist.png" alt="Logo" class="w-32 mx-auto mb-6 rounded-md shadow-sm">
                <h2 class="text-2xl font-bold" id="loginTitle">Willkommen</h2>
            </div>
            <form id="authForm" class="space-y-5">
                <input type="email" id="authEmail" required class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-xl" placeholder="E-Mail">
                <input type="password" id="authPassword" required class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-xl" placeholder="Passwort">
                <div id="authError" class="hidden text-red-600 text-sm bg-red-50 p-3 rounded-lg">Fehler.</div>
                <button type="submit" id="authSubmitBtn" class="w-full bg-red-600 text-white font-bold py-3 rounded-xl">Einloggen</button>
            </form>
            <button id="toggleAuthModeBtn" class="w-full text-red-600 text-sm font-medium mt-6">Neu hier? Registrieren</button>
        </div>
    </div>

    <!-- HEADER -->
    <header id="mainHeader" class="hidden shadow-sm z-10 px-4 pb-4 pt-4 sticky top-0 flex-col md:flex-row justify-between gap-4 border-b border-gray-300 bg-white/90 backdrop-blur print:hidden">
        <div class="flex items-center gap-3 cursor-pointer" id="logoBtn">
            <img src="logomr78brutalist.png" class="h-10 w-auto rounded shadow-sm">
            <h1 class="text-xl font-bold">Meine Rezepte</h1>
        </div>
        <div class="flex-1 max-w-xl relative" id="searchContainer">
            <input type="text" id="searchInput" placeholder="Suchen..." class="w-full pl-4 pr-4 py-2.5 bg-gray-100 border border-gray-300 rounded-full">
        </div>
        <div class="flex items-center gap-2 overflow-x-auto hide-scrollbar">
            <button id="navProductsBtn" class="flex-shrink-0 bg-white hover:bg-orange-50 text-orange-700 font-bold py-2 px-4 rounded-full border border-orange-200 flex gap-2"><span class="text-lg">🥫</span><span class="hidden sm:inline">Produkte</span></button>
            <button id="trashViewBtn" class="p-2 text-gray-500 rounded-full" title="Papierkorb">🗑️</button>
            <button id="importBtn" class="bg-white border border-gray-300 py-2 px-4 rounded-full font-medium">Import</button>
            <button id="newRecipeBtn" class="bg-red-600 text-white py-2 px-5 rounded-full font-medium">Neu</button>
            <button id="logoutBtn" class="p-2 text-gray-500 rounded-full" title="Abmelden">🚪</button>
        </div>
    </header>

    <main id="mainContent" class="hidden flex-1 overflow-y-auto p-4 md:p-6 safe-pb relative print:p-0">
        
        <!-- REZEPTE LISTE -->
        <div id="listView" class="max-w-[1600px] mx-auto hidden">
            <div class="flex flex-col lg:flex-row justify-between gap-4 mb-6" id="listControls">

                <div class="flex items-center gap-3 flex-wrap">
                    <div class="flex bg-white border border-gray-300 rounded-full p-1">
                        <button id="viewGridBtn" class="p-1.5 rounded-full bg-gray-200">🔲</button>

        </div>

        <!-- PRODUKTE LISTE -->
        <div id="productsListView" class="max-w-[1600px] mx-auto hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-3xl font-black">🥫 Speisekammer</h2>
                <button id="newProductBtn" class="bg-orange-600 text-white font-bold py-2 px-5 rounded-full">Neues Produkt</button>
            </div>
            <div id="productsGrid" class="grid grid-cols-2 md:grid-cols-4 xl:grid-cols-6 gap-4"></div>

        <!-- REZEPT DETAILS -->
        <div id="detailView" class="max-w-5xl mx-auto hidden bg-white rounded-3xl shadow-md overflow-hidden print:shadow-none">
            <div class="bg-gray-50 p-4 border-b border-gray-200 flex justify-between print:hidden">

                <div class="flex gap-2">
                    <button id="startZenModeBtn" class="bg-gray-900 text-white px-4 py-2 rounded-lg text-sm font-bold">Kochen</button>
                    <button id="editRecipeBtn" class="px-3 py-2 text-red-600 bg-white border rounded-lg text-sm font-bold">Bearbeiten</button>

            <div class="p-6 md:p-10">
                <div id="detailGfBanner" class="hidden mb-6"><img src="GFEmilia.png" class="h-16 md:h-20 shadow-md rounded-xl border border-gray-200"></div>
                <div id="detailTags" class="flex flex-wrap gap-2 mb-4"></div>

                <div class="grid lg:grid-cols-3 gap-8">
                    <div class="lg:col-span-1 bg-gray-50 p-6 rounded-2xl">
                        <h3 class="font-bold text-xl mb-4">Zutaten (<span id="detailPortionsCount"></span> P.)</h3>
                        <div class="flex gap-2 mb-4 print:hidden">
                            <button id="btnPortionMinus" class="px-3 py-1 bg-white border rounded font-bold">-</button>
                            <button id="btnPortionPlus" class="px-3 py-1 bg-white border rounded font-bold">+</button>
                        </div>

                    </div>
                    <div class="lg:col-span-2">
                        <h3 class="font-bold text-xl mb-4">Zubereitung</h3>
                        <div id="detailInstructions" class="space-y-3"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- REZEPT FORMULAR -->
        <div id="formView" class="max-w-4xl mx-auto hidden bg-white rounded-3xl shadow-md overflow-hidden">
            <div class="p-4 border-b bg-gray-50 flex justify-between">
                <button class="backToHomeBtn px-4 py-2 bg-white rounded-lg border font-medium text-sm">Abbrechen</button>
                <h3 class="font-bold" id="formHeaderTitle">Rezept</h3>
                <div class="w-24"></div>
            </div>
            <div class="p-6">
                <div id="importSection" class="mb-8 bg-gray-100 p-4 rounded-xl">
                    <p class="font-bold mb-2">Von Webseite importieren</p>
                    <div class="flex gap-2">
                        <input type="url" id="importUrlInput" class="flex-1 px-3 py-2 rounded-lg border" placeholder="URL einfügen">
                        <button id="startImportBtn" class="bg-gray-900 text-white px-4 rounded-lg">Laden</button>
                    </div>
                    <p id="importStatus" class="text-sm mt-2 hidden"></p>
                </div>
                <form id="recipeForm" class="space-y-6">
                    <input type="text" id="formTitle" required class="w-full px-4 py-3 border rounded-xl text-xl font-bold" placeholder="Titel">
                    <div class="flex items-center gap-4 bg-gray-50 p-4 rounded-xl cursor-pointer" onclick="document.getElementById('formGlutenFree').click()">
                        <img src="GFEmilia.png" class="h-10 rounded">
                        <input type="checkbox" id="formGlutenFree" class="w-6 h-6 ml-auto pointer-events-none">
                    </div>
                    <input type="file" id="imageInput" accept="image/*" class="w-full">
                    <div id="tagInputContainer" class="border rounded-xl p-2 flex flex-wrap gap-2">
                        <div id="activeTagsContainer" class="flex flex-wrap gap-2"></div>
                        <input type="text" id="formTagInput" class="outline-none bg-transparent flex-1" placeholder="Tags...">
                    </div>
                    <div class="grid grid-cols-2 md:grid-cols-5 gap-3">
                        <input type="number" id="formPortions" placeholder="Portionen" class="border p-2 rounded">
                        <input type="number" id="formPrepTime" placeholder="Arbeitszeit" class="border p-2 rounded">
                        <input type="number" id="formCookTime" placeholder="Kochzeit" class="border p-2 rounded">
                        <input type="number" id="formKcal" placeholder="Kcal" class="border p-2 rounded">
                        <input type="number" id="formCarbs" placeholder="KH" class="border p-2 rounded">
                    </div>
                    <div class="bg-gray-50 p-4 rounded-xl">
                        <button type="button" id="addIngredientBtn" class="mb-4 bg-white border px-3 py-1 rounded text-sm font-bold">Zutat +</button>
                        <div id="ingredientsList" class="space-y-2">
                            <div class="ingredient-row flex gap-2">
                                <input type="text" class="ingredient-name flex-1 border p-2 rounded text-sm" placeholder="Name">
                                <input type="text" class="ingredient-amount w-16 border p-2 rounded text-sm" placeholder="Menge">
                                <select class="ingredient-unit w-20 border p-2 rounded text-sm"><option value="g">g</option><option value="ml">ml</option><option value="Stk">Stk</option><option value="EL">EL</option><option value="">-</option></select>
                                <button type="button" class="remove-ingredient text-red-500 p-2">X</button>
                            </div>
                        </div>
                    </div>
                    <textarea id="formInstructions" rows="6" class="w-full border p-4 rounded-xl" placeholder="Anleitung..."></textarea>
                    <button type="submit" class="w-full bg-green-600 text-white font-bold py-3 rounded-xl">Speichern</button>
                </form>
            </div>
        </div>

        <!-- PRODUKT FORMULAR -->
        <div id="productFormView" class="max-w-2xl mx-auto hidden bg-white rounded-3xl shadow-md overflow-hidden">
            <div class="p-4 border-b bg-gray-50 flex justify-between">
                <button class="backToProductsBtn px-4 py-2 bg-white rounded-lg border font-medium text-sm">Abbrechen</button>
                <h3 class="font-bold">Produkt</h3>
                <div class="w-24"></div>
            </div>
            <div class="p-6">
                <div class="mb-6 bg-orange-50 p-4 rounded-xl">
                    <div class="flex gap-2">
                        <input type="text" id="barcodeInput" placeholder="EAN Barcode..." class="flex-1 px-3 py-2 rounded-lg border">
                        <button id="fetchBarcodeBtn" class="bg-orange-600 text-white px-4 rounded-lg font-bold">Suchen</button>
                    </div>
                    <p id="barcodeStatus" class="text-sm mt-2 hidden"></p>
                </div>
                <form id="productForm" class="space-y-6">
                    <input type="text" id="prodName" required class="w-full border p-3 rounded-xl font-bold" placeholder="Produktname">
                    <input type="text" id="prodBrand" class="w-full border p-3 rounded-xl" placeholder="Marke">
                    <div class="flex items-center gap-4 bg-gray-50 p-4 rounded-xl cursor-pointer" onclick="document.getElementById('prodGlutenFree').click()">
                        <img src="GFEmilia.png" class="h-10 rounded">
                        <input type="checkbox" id="prodGlutenFree" class="w-6 h-6 ml-auto pointer-events-none">
                    </div>
                    <textarea id="prodIngredients" rows="4" class="w-full border p-3 rounded-xl" placeholder="Zutaten..."></textarea>
                    <input type="file" id="prodImageInput" accept="image/*" class="w-full">
                    <button type="submit" class="w-full bg-orange-600 text-white font-bold py-3 rounded-xl">Produkt Speichern</button>
                </form>
            </div>
        </div>

        <!-- PRODUKT DETAILS -->
        <div id="productDetailView" class="max-w-2xl mx-auto hidden bg-white rounded-3xl shadow-md overflow-hidden">
            <div class="p-4 border-b bg-gray-50 flex justify-between">
                <button class="backToProductsBtn px-4 py-2 bg-white rounded-lg border font-medium text-sm">Zurück</button>
                <div class="flex gap-2">
                    <button id="editProductBtn" class="px-3 py-1 text-orange-600 border rounded">Edit</button>
                    <button id="deleteProductBtn" class="px-3 py-1 text-red-600 border rounded">Löschen</button>
                </div>
            </div>
            <div class="p-6 text-center">
                <img id="detailProdImage" class="w-32 h-32 mx-auto object-contain mb-4 border rounded-xl p-2">
                <div id="detailProdGfBadge" class="hidden mb-4"><img src="GFEmilia.png" class="h-10 mx-auto rounded shadow"></div>
                <h2 id="detailProdName" class="text-2xl font-black">Name</h2>
                <p id="detailProdBrand" class="text-gray-500 mb-4">Marke</p>
                <div class="text-left bg-gray-50 p-4 rounded-xl">
                    <h4 class="font-bold mb-2">Zutaten:</h4>
                    <p id="detailProdIngredients" class="text-sm"></p>
                </div>
            </div>
        </div>

        <!-- ZEN MODE -->
        <div id="zenModeView" class="hidden fixed inset-0 bg-white z-[100] flex flex-col justify-between">
            <div class="p-4 bg-gray-900 text-white flex justify-between items-center">
                <button id="exitZenModeBtn" class="font-bold text-red-400">X Schließen</button>
                <span id="zenCurrentStepNum" class="font-bold text-xl"></span>
            </div>
            <div class="flex-1 flex items-center justify-center p-8 text-center text-3xl font-black" id="zenInstructionText"></div>
            <div class="p-4 bg-gray-100 flex justify-between">
                <button id="zenPrevBtn" class="px-6 py-4 bg-gray-300 rounded-xl font-bold">Zurück</button>
                <button id="zenNextBtn" class="px-10 py-4 bg-red-600 text-white rounded-xl font-bold">Weiter</button>
            </div>
        </div>
        
        <div id="floatingTimerContainer" class="fixed bottom-6 right-6 z-[110] flex flex-col gap-3 print:hidden pointer-events-none *:pointer-events-auto"></div>

    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, doc, setDoc, deleteDoc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyAou4wXEFIAu8NgbC83CvgV5R-MQVbhjOQ", authDomain: "rezepte-5cf2b.firebaseapp.com", projectId: "rezepte-5cf2b", storageBucket: "rezepte-5cf2b.firebasestorage.app", messagingSenderId: "309619660672", appId: "1:309619660672:web:59523676acc8b294415365", measurementId: "G-7VGKEKCWDV" };
        const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);
        const appNamespace = 'meine-rezepte-app'; 

        let currentUser = null, recipes = [], products = [], customIngredients = [], currentRecipeTags = [];
        let activeFilter = null, currentDetailRecipeId = null, currentEditRecipeId = null, currentEditProductId = null;
        let currentImageBase64 = null, currentProdImageBase64 = null, currentDetailRecipe = null, currentDisplayPortions = 4;
        let showFavoritesOnly = false, showTrashView = false, currentSortOption = 'newest', currentViewMode = localStorage.getItem('recipeAppViewMode') || 'grid';
        let zenSteps = [], currentZenStepIndex = 0, activeTimers = [];

        const views = {
            login: document.getElementById('loginView'), list: document.getElementById('listView'), detail: document.getElementById('detailView'),
            form: document.getElementById('formView'), zen: document.getElementById('zenModeView'), productsList: document.getElementById('productsListView'),
            productForm: document.getElementById('productFormView'), productDetail: document.getElementById('productDetailView')
        };
        const loadingOverlay = document.getElementById('loadingOverlay');

        // VIEWS
        function showView(viewName) {
            Object.values(views).forEach(v => v?.classList.add('hidden'));
            if(views[viewName]) views[viewName].classList.remove('hidden');
            const searchCont = document.getElementById('searchContainer');
            if(viewName === 'list') {
                searchCont?.classList.remove('hidden');
                document.getElementById('mainHeaderTitle').textContent = showTrashView ? "Papierkorb" : "Meine Rezepte";
                renderRecipes();
            } else {
                searchCont?.classList.add('hidden');
            }
            window.scrollTo(0,0);
        }

        window.addEventListener('hashchange', () => {
            if(!currentUser) return;
            showTrashView = window.location.hash === '#trash';
            const h = window.location.hash;
            if(h === '#new') { resetForm(); showView('form'); }
            else if(h === '#import') { resetForm(); showView('form'); }
            else if(h === '#edit') showView('form');
            else if(h === '#products') { showView('productsList'); renderProducts(); }
            else if(h === '#new-product') { resetProductForm(); showView('productForm'); }
            else if(h === '#edit-product') showView('productForm');
            else if(h.startsWith('#product-')) openProductDetail(h.replace('#product-', ''));
            else if(h.startsWith('#recipe-')) openRecipeDetail(h.replace('#recipe-', ''));
            else showView('list');
        });

        document.getElementById('logoBtn')?.addEventListener('click', () => window.location.hash = '');
        document.getElementById('navProductsBtn')?.addEventListener('click', () => window.location.hash = '#products');
        document.getElementById('newProductBtn')?.addEventListener('click', () => window.location.hash = '#new-product');
        document.getElementById('newRecipeBtn')?.addEventListener('click', () => window.location.hash = '#new');
        document.getElementById('importBtn')?.addEventListener('click', () => window.location.hash = '#import');
        document.getElementById('trashViewBtn')?.addEventListener('click', () => window.location.hash = showTrashView ? '' : '#trash');
        document.querySelectorAll('.backToHomeBtn').forEach(b => b.addEventListener('click', () => window.location.hash = showTrashView ? '#trash' : ''));
        document.querySelectorAll('.backToProductsBtn').forEach(b => b.addEventListener('click', () => window.location.hash = '#products'));

        // VIEW TOGGLE
        const vGridBtn = document.getElementById('viewGridBtn'), vListBtn = document.getElementById('viewListBtn');
        function updateViewToggleUI() {
            if(!vGridBtn || !vListBtn) return;
            vGridBtn.className = currentViewMode === 'grid' ? 'p-1.5 rounded-full bg-gray-200 text-gray-800' : 'p-1.5 rounded-full text-gray-500 hover:bg-gray-100';
            vListBtn.className = currentViewMode === 'list' ? 'p-1.5 rounded-full bg-gray-200 text-gray-800' : 'p-1.5 rounded-full text-gray-500 hover:bg-gray-100';
        }
        vGridBtn?.addEventListener('click', () => { currentViewMode = 'grid'; localStorage.setItem('recipeAppViewMode', 'grid'); updateViewToggleUI(); renderRecipes(); });
        vListBtn?.addEventListener('click', () => { currentViewMode = 'list'; localStorage.setItem('recipeAppViewMode', 'list'); updateViewToggleUI(); renderRecipes(); });
        updateViewToggleUI();

        // AUTH
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                loadingOverlay?.classList.remove('hidden');
                views.login?.classList.add('hidden');
                document.getElementById('mainHeader')?.classList.remove('hidden');
                document.getElementById('mainHeader')?.classList.add('flex');
                document.getElementById('mainContent')?.classList.remove('hidden');
                document.getElementById('mainContent')?.classList.add('flex-1');
                startDatabaseListeners();
                window.location.hash = ''; 
            } else {
                currentUser = null;
                document.getElementById('mainHeader')?.classList.add('hidden');
                document.getElementById('mainContent')?.classList.add('flex-1');
                showView('login');
                loadingOverlay?.classList.add('hidden');
            }
        });

        document.getElementById('authForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const em = document.getElementById('authEmail').value, pw = document.getElementById('authPassword').value;
            try { await signInWithEmailAndPassword(auth, em, pw); } 
            catch { alert("Fehler beim Login."); }
        });

        // DB LISTENERS
        function startDatabaseListeners() {
            if(!currentUser) return;
            onSnapshot(collection(db, 'artifacts', appNamespace, 'users', currentUser.uid, 'recipes'), (snap) => {
                try {
                    recipes = [];
                    snap.forEach(d => { recipes.push({ id: d.id, ...d.data() }); });
                    if(window.location.hash === '' || window.location.hash === '#trash') renderRecipes();
                } catch(e) { console.error(e); } finally { loadingOverlay?.classList.add('hidden'); }
            });
            onSnapshot(collection(db, 'artifacts', appNamespace, 'users', currentUser.uid, 'products'), (snap) => {
                products = []; snap.forEach(d => { products.push({ id: d.id, ...d.data() }); });
                if(window.location.hash === '#products') renderProducts();
            });
            onSnapshot(doc(db, 'artifacts', appNamespace, 'users', currentUser.uid, 'settings', 'ingredients'), (d) => {
                if (d.exists() && d.data().list) customIngredients = d.data().list;
            });
        }

        // RENDER PRODUCTS
        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            if(!grid) return; grid.innerHTML = '';
            products.forEach(p => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow border border-orange-200 cursor-pointer overflow-hidden";
                card.onclick = () => window.location.hash = `#product-${p.id}`;
                card.innerHTML = `
                    <div class="h-32 bg-gray-100 flex justify-center items-center relative">
                        ${p.isGlutenFree ? `<img src="GFEmilia.png" class="absolute top-2 left-2 h-6 rounded shadow border border-white/50">` : ''}
                        ${p.imageBase64 ? `<img src="${p.imageBase64}" class="h-full w-full object-contain p-2">` : '🥫'}
                    </div>
                    <div class="p-3"><h3 class="font-bold text-sm truncate">${p.name}</h3><p class="text-xs text-orange-600">${p.brand}</p></div>
                `;
                grid.appendChild(card);
            });
        }

        // PRODUCT DETAIL
        function openProductDetail(id) {
            const p = products.find(x => x.id === id);
            if(!p) return;
            currentEditProductId = p.id;
            document.getElementById('detailProdName').textContent = p.name;
            document.getElementById('detailProdBrand').textContent = p.brand;
            document.getElementById('detailProdIngredients').textContent = p.ingredients || 'Keine Zutaten.';
            document.getElementById('detailProdImage').src = p.imageBase64 || '';
            document.getElementById('detailProdGfBadge').style.display = p.isGlutenFree ? 'block' : 'none';
            showView('productDetail');
        }

        document.getElementById('editProductBtn')?.addEventListener('click', () => {
            const p = products.find(x => x.id === currentEditProductId);
            if(!p) return;
            resetProductForm();
            currentEditProductId = p.id;
            document.getElementById('prodName').value = p.name || '';
            document.getElementById('prodBrand').value = p.brand || '';
            document.getElementById('barcodeInput').value = p.barcode || '';
            document.getElementById('prodIngredients').value = p.ingredients || '';
            document.getElementById('prodGlutenFree').checked = p.isGlutenFree;
            currentProdImageBase64 = p.imageBase64;
            if(p.imageBase64) {
                document.getElementById('prodImagePreview').src = p.imageBase64;
                document.getElementById('prodImagePreview').classList.remove('hidden');
            }
            window.location.hash = '#edit-product';
        });

        document.getElementById('deleteProductBtn')?.addEventListener('click', async () => {
            if(confirm("Löschen?") && currentEditProductId) {
                await deleteDoc(doc(db, 'artifacts', appNamespace, 'users', currentUser.uid, 'products', currentEditProductId));
                window.location.hash = '#products';
            }
        });

        function resetProductForm() {
            document.getElementById('productForm')?.reset();
            currentEditProductId = null; currentProdImageBase64 = null;
            document.getElementById('prodImagePreview')?.classList.add('hidden');
        }

        document.getElementById('prodImageInput')?.addEventListener('change', (e) => {
            const r = new FileReader();
            r.onload = (ev) => { currentProdImageBase64 = ev.target.result; document.getElementById('prodImagePreview').src = currentProdImageBase64; document.getElementById('prodImagePreview').classList.remove('hidden'); };
            if(e.target.files[0]) r.readAsDataURL(e.target.files[0]);
        });

        document.getElementById('productForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const d = {
                name: document.getElementById('prodName').value, brand: document.getElementById('prodBrand').value,
                barcode: document.getElementById('barcodeInput').value, ingredients: document.getElementById('prodIngredients').value,
                isGlutenFree: document.getElementById('prodGlutenFree').checked, imageBase64: currentProdImageBase64
            };
            if(currentEditProductId) await updateDoc(doc(db, 'artifacts', appNamespace, 'users', currentUser.uid, 'products', currentEditProductId), d);
            else await addDoc(collection(db, 'artifacts', appNamespace, 'users', currentUser.uid, 'products'), { ...d, createdAt: new Date().toISOString() });
            window.location.hash = '#products';
        });

        // YUKA FETCH
        document.getElementById('fetchBarcodeBtn')?.addEventListener('click', async () => {
            const b = document.getElementById('barcodeInput').value;
            if(!b) return;
            try {
                const res = await fetch(`https://world.openfoodfacts.org/api/v0/product/${b}.json`);
                const data = await res.json();
                if(data.product) {
                    document.getElementById('prodName').value = data.product.product_name_de || data.product.product_name || '';
                    document.getElementById('prodBrand').value = data.product.brands || '';
                    document.getElementById('prodIngredients').value = data.product.ingredients_text_de || data.product.ingredients_text || '';
                    if(data.product.allergens_tags?.includes('en:gluten')) document.getElementById('prodGlutenFree').checked = false;
                }
            } catch(e) { alert("Barcode nicht gefunden."); }
        });

        // RENDER RECIPES
        function renderRecipes() {
            const grid = document.getElementById('recipeGrid');
            if(!grid) return;
            grid.className = currentViewMode === 'grid' ? "grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6" : "grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3";
            grid.innerHTML = '';
            
            let filtered = recipes.filter(r => showTrashView ? r.isDeleted : !r.isDeleted);
            filtered.forEach(r => {
                const c = document.createElement('div');
                c.onclick = () => window.location.hash = `#recipe-${r.id}`;
                let gfBadge = r.isGlutenFree ? `<img src="GFEmilia.png" class="absolute top-2 left-2 h-6 sm:h-8 rounded border border-white/40 shadow">` : '';
                
                if(currentViewMode === 'grid') {
                    c.className = "bg-white rounded-3xl shadow-sm hover:shadow-lg border cursor-pointer flex flex-col h-full";
                    let img = r.imageBase64 ? `<img src="${r.imageBase64}" class="w-full h-full object-cover">` : `<div class="w-full h-full bg-gray-200 flex justify-center items-center text-3xl font-black">${r.title[0]}</div>`;
                    c.innerHTML = `
                        <div class="h-48 relative rounded-t-3xl overflow-hidden">${gfBadge}${img}</div>
                        <div class="p-5 flex-1 flex flex-col"><h3 class="font-bold text-lg mb-2">${r.title}</h3>
                        <div class="flex flex-wrap gap-1 mt-auto">${(r.tags||[]).slice(0,3).map(t => `<span class="text-[10px] bg-gray-100 px-2 py-1 rounded font-bold">${t}</span>`).join('')}</div></div>
                    `;
                } else {
                    c.className = "bg-white rounded-xl shadow-sm hover:shadow-md border cursor-pointer flex p-2 h-auto min-h-[90px]";
                    let img = r.imageBase64 ? `<img src="${r.imageBase64}" class="w-full h-full object-cover rounded-lg">` : `<div class="w-full h-full bg-gray-200 rounded-lg flex justify-center items-center text-xl font-black">${r.title[0]}</div>`;
                    
                    let nut = [];
                    if(r.nutrition?.kcal) nut.push(`<span class="bg-orange-100 text-orange-800 px-1.5 py-0.5 rounded text-[10px] font-bold">${r.nutrition.kcal} kcal</span>`);
                    if(r.nutrition?.carbs) nut.push(`<span class="bg-blue-100 text-blue-800 px-1.5 py-0.5 rounded text-[10px] font-bold">${r.nutrition.carbs}g KH</span>`);
                    if(r.nutrition?.sugar) nut.push(`<span class="bg-pink-100 text-pink-800 px-1.5 py-0.5 rounded text-[10px] font-bold">${r.nutrition.sugar}g Zucker</span>`);
                    if(r.nutrition?.protein) nut.push(`<span class="bg-teal-100 text-teal-800 px-1.5 py-0.5 rounded text-[10px] font-bold">${r.nutrition.protein}g Prot</span>`);
                    if(r.nutrition?.fat) nut.push(`<span class="bg-purple-100 text-purple-800 px-1.5 py-0.5 rounded text-[10px] font-bold">${r.nutrition.fat}g Fett</span>`);

                    c.innerHTML = `
                        <div class="h-16 w-16 sm:h-20 sm:w-20 relative shrink-0 mr-3">${gfBadge}${img}</div>
                        <div class="flex-1 min-w-0 py-1"><h3 class="font-bold text-sm sm:text-base leading-tight truncate mb-1">${r.title}</h3>
                        <div class="flex flex-wrap gap-1">${nut.join('')}</div></div>
                    `;
                }
                grid.appendChild(c);
            });
        }

        // RECIPE DETAIL
        function openRecipeDetail(id) {
            const r = recipes.find(x => x.id === id);
            if(!r) return;
            currentDetailRecipe = r; currentDetailRecipeId = r.id;
            document.getElementById('detailTitle').textContent = r.title;
            const img = document.getElementById('detailImage');
            if(img) { img.src = r.imageBase64 || ''; img.parentElement.style.display = r.imageBase64 ? 'block' : 'none'; }
            const gf = document.getElementById('detailGfBanner');
            if(gf) gf.style.display = r.isGlutenFree ? 'block' : 'none';
            
            document.getElementById('detailInstructions').innerHTML = (r.instructions||'').split('\n').map(s=>`<div class="p-2 border-b"><p>${s}</p></div>`).join('');
            document.getElementById('detailIngredients').innerHTML = (r.ingredients||[]).map(i=>`<li class="flex justify-between py-1 border-b"><span>${i.name}</span><span class="font-bold">${i.amount} ${i.unit}</span></li>`).join('');
            showView('detail');
        }

        // FORM
        function resetForm() { document.getElementById('recipeForm')?.reset(); currentEditRecipeId=null; currentImageBase64=null; document.getElementById('formImagePreview').style.display='none'; }
        document.getElementById('imageInput')?.addEventListener('change', e => {
            const reader = new FileReader();
            reader.onload = ev => { currentImageBase64 = ev.target.result; document.getElementById('formImagePreview').src = currentImageBase64; document.getElementById('formImagePreview').style.display = 'block'; };
            if(e.target.files[0]) reader.readAsDataURL(e.target.files[0]);
        });

        document.getElementById('addIngredientBtn')?.addEventListener('click', () => {
            const r = document.querySelector('.ingredient-row').cloneNode(true);
            r.querySelectorAll('input').forEach(i=>i.value='');
            r.querySelector('.remove-ingredient').onclick = () => r.remove();
            document.getElementById('ingredientsList').appendChild(r);
        });

        document.getElementById('recipeForm')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const ings = Array.from(document.querySelectorAll('.ingredient-row')).map(r => ({
                name: r.querySelector('.ingredient-name').value, amount: r.querySelector('.ingredient-amount').value, unit: r.querySelector('.ingredient-unit').value
            })).filter(i => i.name);

            const d = {
                title: document.getElementById('formTitle').value, isGlutenFree: document.getElementById('formGlutenFree').checked,
                ingredients: ings, instructions: document.getElementById('formInstructions').value, imageBase64: currentImageBase64,
                nutrition: { kcal: document.getElementById('formKcal').value, carbs: document.getElementById('formCarbs').value, sugar: document.getElementById('formSugar').value, protein: document.getElementById('formProtein').value, fat: document.getElementById('formFat').value }
            };
            
            if(currentEditRecipeId) await updateDoc(doc(db, 'artifacts', appNamespace, 'users', currentUser.uid, 'recipes', currentEditRecipeId), d);
            else await addDoc(collection(db, 'artifacts', appNamespace, 'users', currentUser.uid, 'recipes'), { ...d, createdAt: new Date().toISOString(), isDeleted: false });
            window.location.hash = '';
        });

        // URL SCRAPER
        document.getElementById('startImportBtn')?.addEventListener('click', async () => {
            const url = document.getElementById('importUrlInput').value; if(!url) return;
            try {
                const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(url)}`);
                const html = (await res.json()).contents;
                const docObj = new DOMParser().parseFromString(html, 'text/html');
                
                let title = docObj.querySelector('h1')?.textContent.trim();
                let inst = Array.from(docObj.querySelectorAll('.recipe-instructions, .instructions, [itemprop="recipeInstructions"]')).map(e=>e.textContent.trim()).join('\n');
                
                if(title) document.getElementById('formTitle').value = title;
                if(inst) document.getElementById('formInstructions').value = inst;
                if(html.toLowerCase().includes('glutenfrei')) document.getElementById('formGlutenFree').checked = true;
                
                document.getElementById('importStatus').textContent = "Importiert! Bitte prüfen.";
                document.getElementById('importStatus').classList.remove('hidden');
            } catch { alert("Fehler beim Import."); }
        });

    </script>
</body>
</html>
